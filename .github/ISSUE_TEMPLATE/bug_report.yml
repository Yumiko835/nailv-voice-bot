name: Bug report / 问题反馈
description: A reproducible source or runtime issue; do not upload credentials or private audio.
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Python, GPU, engine versions
      description: Include relevant versions; remove account IDs and local usernames.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, actual result
      description: Prefer fictional text and redacted logs. Never include keys, cookies, QQ profiles or unlicensed recordings.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Offline checks and smallest relevant log
  - type: checkboxes
    id: privacy
    attributes:
      label: Submission
      options:
        - label: I removed credentials, login data and private conversations.
          required: true
